<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description"
    content="Job Application Tracker - track available jobs, mark them for interview or rejection, and monitor your application stats." />
  <title>Job Application Trackers</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="dashboard">
      <h1 class="app-title">Job Application Tracker</h1>
      <section class="stats" aria-label="Application statistics">
        <article class="stat-card">
          <p class="stat-label">Total</p>
          <p class="stat-value" id="stat-total">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Interview</p>
          <p class="stat-value stat-interview" id="stat-interview">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Rejected</p>
          <p class="stat-value stat-rejected" id="stat-rejected">0</p>
        </article>
      </section>
    </header>
    <section class="jobs-section" aria-label="Available jobs">
      <div class="jobs-header">
        <h2 class="section-title">Available Jobs</h2>
        <p class="jobs-count" id="jobs-count">0 jobs</p>
      </div>

      <div class="tabs" role="tablist" aria-label="Filter jobs">
        <button class="tab is-active" role="tab" data-tab="all" aria-selected="true">All</button>
        <button class="tab" role="tab" data-tab="interview" aria-selected="false">Interview</button>
        <button class="tab" role="tab" data-tab="rejected" aria-selected="false">Rejected</button>
      </div>

      <div class="job-list" id="job-list"></div>

      <div class="empty-state" id="empty-state" hidden>
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <line x1="10" y1="9" x2="8" y2="9" />
        </svg>
        <p class="empty-title">No jobs available</p>
        <p class="empty-subtitle">Check back soon for new job opportunities</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
